<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111e2b"><meta name="description" content="Flick, bounce, and sink. A tiny ricochet puzzle with 18 handcrafted rooms."><title>Pocket Bankshot</title></head><body><main id="app"><header><div class="brand">POCKET<span>BANKSHOT<span class="dot">.</span></span></div><div class="tools"><button id="sound" aria-label="Enable sound">Sound off</button><button id="pause" aria-label="Pause game">Ⅱ</button></div></header><section class="game-shell"><div class="hud"><button id="rooms" class="room-button"><small>ROOM <span id="roomNo">01</span> / 18</small><strong id="roomName">First flick</strong></button><div class="stat"><small>SHOTS</small><strong id="shots">0</strong></div><div class="stat"><small>PAR</small><strong id="par">2</strong></div><div class="sparks" id="sparks" aria-label="0 of 3 sparks collected">◇◇◇</div></div><div id="board"><div id="canvas"></div><section id="overlay" class="overlay"><div class="card"><span class="eyebrow">A LITTLE ANGLE. A BIG PAYOFF.</span><h1>Make it<br><em>bounce.</em></h1><p>Collect the three sparks.<br>Then sink your puck in the green pocket.</p><div class="instruction"><b>↗</b><span>Drag from the puck to aim.<br>Release to shoot.</span></div><button id="primary" class="primary">LET’S PLAY <span>↗</span></button><p class="micro">18 rooms · No timer · Every bounce counts</p></div></section></div><footer><span id="hint">Find your angle.</span><button id="retry" aria-label="Restart this room">↻ Retry</button></footer></section><div class="below"><span>FLICK. BOUNCE. SINK.</span><span id="progress">0 / 18 rooms cleared</span></div></main><script type="module" src="/src/main.js"></script></body></html>
