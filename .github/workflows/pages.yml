name: Test and publish Pocket Golf

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Browser and device tests
        run: |
          npm run dev > /tmp/pocket-golf-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5188/ > /dev/null && break
            sleep 1
          done
          npm run test:browser
          npm run test:devices
      - name: Build and test Poki distribution
        run: |
          npm run build:poki
          npm run test:poki
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Golf-Poki
          path: poki-dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            qa/*.json
            qa/*.png
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
